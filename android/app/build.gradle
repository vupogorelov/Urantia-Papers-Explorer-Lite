plugins {
    id 'com.android.application'
}

def releaseKeyPath = System.getenv('ANDROID_KEYSTORE_PATH')

android {
    namespace = 'ubsite.lite'
    compileSdk = 36

    defaultConfig {
        applicationId = 'ubsite.lite'
        minSdk = 26
        targetSdk = 36
        versionCode = (System.getenv('ANDROID_VERSION_CODE') ?: '1').toInteger()
        versionName = System.getenv('ANDROID_VERSION_NAME') ?: '0.1'
    }

    signingConfigs {
        release {
            if (releaseKeyPath) {
                storeFile file(releaseKeyPath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            signingConfig releaseKeyPath ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
}
