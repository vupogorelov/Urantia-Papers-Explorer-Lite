name: Android APK release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: apk-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ANDROID_BUILD_VARIANT: release
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Check out project
        uses: actions/checkout@v7

      - name: Validate and resolve SemVer
        run: node scripts/validate-release.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore Android signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upexplorer-release.keystore
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Set ANDROID_KEYSTORE_BASE64 and the other Android signing secrets in repository Actions settings."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"

      - name: Build signed APK
        run: npm run build
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upexplorer-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Publish GitHub Release
        run: |
          gh release create "$RELEASE_TAG" dist/upexplorer.apk --verify-tag --generate-notes --title "$RELEASE_TAG" || {
            if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then exit 1; fi
            gh release upload "$RELEASE_TAG" dist/upexplorer.apk --clobber
          }
          notes="$(gh release view "$RELEASE_TAG" --json body --jq '.body // ""')"
          notes="$(printf '%s\n' "$notes" | sed '/<!-- upexplorer-version-code=[0-9][0-9]* -->/d')"
          printf '%s\n\n<!-- upexplorer-version-code=%s -->\n' "$notes" "$ANDROID_VERSION_CODE" > "$RUNNER_TEMP/release-notes.md"
          gh release edit "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
